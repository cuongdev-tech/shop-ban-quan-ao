{% extends 'layout.html' %}
{% block content %}
<div class="container-xl mt-4 mb-5">
  <div class="row justify-content-center"><div class="col-lg-7">
    <div class="bg-white rounded-4 shadow-sm p-4">
      <h4 class="fw-bold mb-3">{{ action }}</h4>
      <form method="POST">
        <div class="row g-2">
          <div class="col-md-6"><label class="form-label small fw-bold">Tỉnh *</label><input name="province" class="form-control" required value="{{ s.get('province','') }}"></div>
          <div class="col-md-6"><label class="form-label small fw-bold">Chi nhánh *</label><input name="branch_name" class="form-control" required value="{{ s.get('branch_name','') }}"></div>
        </div>
        <div class="mt-2"><label class="form-label small fw-bold">Địa chỉ *</label><input name="address" class="form-control" required value="{{ s.get('address','') }}"></div>
        <div class="row g-2 mt-2">
          <div class="col-md-6"><label class="form-label small fw-bold">Giờ mở cửa</label><input name="open_hours" class="form-control" value="{{ s.get('open_hours','8:00 - 22:00') }}"></div>
          <div class="col-md-6"><label class="form-label small fw-bold">Map URL</label><input name="map_url" class="form-control" value="{{ s.get('map_url','') }}"></div>
        </div>
        <div class="form-check mt-3"><input type="checkbox" name="is_active" class="form-check-input" {% if s.get('is_active',1) %}checked{% endif %}><label class="form-check-label small fw-bold">Hiển thị</label></div>
        <div class="d-flex gap-2 justify-content-end mt-3"><a href="{{ url_for('admin_stores') }}" class="btn btn-light rounded-pill px-4 fw-bold">Hủy</a><button class="btn btn-dark rounded-pill px-4 fw-bold" type="submit">Lưu</button></div>
      </form>
    </div>
  </div></div>
</div>
{% endblock %}
