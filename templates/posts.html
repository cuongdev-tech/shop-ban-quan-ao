{% extends 'layout.html' %}
{% block content %}
<div class="container-xl mt-4 mb-5">
  <h3 class="fw-bold text-uppercase mb-1">Bài viết phối đồ</h3>
  <p class="text-muted small mb-4">Gợi ý phối đồ theo mùa/dịp, gắn sản phẩm mua ngay.</p>
  <div class="row g-3">
    {% for r in rows %}
    <div class="col-md-6 col-lg-4">
      <a href="{{ url_for('post_detail', slug=r.slug) }}" class="text-decoration-none">
        <div class="bg-white rounded-4 shadow-sm overflow-hidden h-100">
          {% if r.image %}<img src="{{ r.image }}" class="w-100" style="height:180px;object-fit:cover;" loading="lazy">{% endif %}
          <div class="p-3">
            <h6 class="fw-bold text-dark mb-1">{{ r.title }}</h6>
            <div class="small text-muted">{{ r.ctitle or '' }} • {{ r.created_at }}</div>
          </div>
        </div>
      </a>
    </div>
    {% else %}
    <div class="col-12 text-center text-muted py-5">Chưa có bài viết.</div>
    {% endfor %}
  </div>
</div>
{% endblock %}
