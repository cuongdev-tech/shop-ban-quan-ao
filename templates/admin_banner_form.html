{% extends 'layout.html' %}
{% block content %}
<div class="container-xl mt-4 mb-5">
  <div class="row justify-content-center"><div class="col-lg-6">
    <div class="bg-white rounded-4 shadow-sm p-4">
      <h4 class="fw-bold mb-3">{{ action }}</h4>
      <form method="POST">
        <div class="mb-2"><label class="form-label small fw-bold">Tiêu đề</label><input name="title" class="form-control" value="{{ b.get('title','') }}"></div>
        <div class="mb-2"><label class="form-label small fw-bold">Ảnh (URL) *</label><input name="image" class="form-control" required value="{{ b.get('image','') }}"></div>
        <div class="mb-2"><label class="form-label small fw-bold">Link khi bấm</label><input name="link" class="form-control" value="{{ b.get('link','') }}" placeholder="/collections/he-2026"></div>
        <div class="mb-2"><label class="form-label small fw-bold">Thứ tự</label><input name="sort_order" type="number" class="form-control" value="{{ b.get('sort_order',0) }}"></div>
        <div class="form-check mt-2"><input type="checkbox" name="is_active" class="form-check-input" {% if b.get('is_active',1) %}checked{% endif %}><label class="form-check-label small fw-bold">Hiển thị</label></div>
        <div class="d-flex gap-2 justify-content-end mt-3"><a href="{{ url_for('admin_banners') }}" class="btn btn-light rounded-pill px-4 fw-bold">Hủy</a><button class="btn btn-dark rounded-pill px-4 fw-bold" type="submit">Lưu</button></div>
      </form>
    </div>
  </div></div>
</div>
{% endblock %}
