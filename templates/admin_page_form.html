{% extends 'layout.html' %}
{% block content %}
<div class="container-xl mt-4 mb-5">
  <div class="row justify-content-center"><div class="col-lg-8">
    <div class="bg-white rounded-4 shadow-sm p-4">
      <h4 class="fw-bold mb-1">Sửa trang: {{ page.slug }}</h4>
      <form method="POST">
        <div class="mb-3"><label class="form-label small fw-bold">Tiêu đề</label><input name="title" class="form-control" required value="{{ page.title }}"></div>
        <div class="mb-3"><label class="form-label small fw-bold">Nội dung (tự viết)</label><textarea name="content" class="form-control" rows="12" required>{{ page.content }}</textarea></div>
        <div class="d-flex gap-2 justify-content-end"><a href="{{ url_for('admin_pages') }}" class="btn btn-light rounded-pill px-4 fw-bold">Hủy</a><button class="btn btn-dark rounded-pill px-4 fw-bold" type="submit">Lưu</button></div>
      </form>
    </div>
  </div></div>
</div>
{% endblock %}
