{% extends 'layout.html' %}
{% block content %}
<div class="container-xl mt-4 mb-5">
  <div class="row justify-content-center"><div class="col-lg-7">
    <div class="bg-white rounded-4 shadow-sm p-4">
      <h4 class="fw-bold mb-3">{{ action }}</h4>
      <form method="POST">
        <div class="mb-2"><label class="form-label small fw-bold">Vị trí *</label><input name="title" class="form-control" required value="{{ j.get('title','') }}"></div>
        <div class="row g-2">
          <div class="col-md-6"><label class="form-label small fw-bold">Địa điểm</label><input name="location" class="form-control" value="{{ j.get('location','') }}"></div>
          <div class="col-md-6"><label class="form-label small fw-bold">Lương</label><input name="salary" class="form-control" value="{{ j.get('salary','') }}"></div>
        </div>
        <div class="mt-2"><label class="form-label small fw-bold">Mô tả *</label><textarea name="description" class="form-control" rows="6" required>{{ j.get('description','') }}</textarea></div>
        <div class="form-check mt-2"><input type="checkbox" name="is_active" class="form-check-input" {% if j.get('is_active',1) %}checked{% endif %}><label class="form-check-label small fw-bold">Hiển thị</label></div>
        <div class="d-flex gap-2 justify-content-end mt-3"><a href="{{ url_for('admin_jobs') }}" class="btn btn-light rounded-pill px-4 fw-bold">Hủy</a><button class="btn btn-dark rounded-pill px-4 fw-bold" type="submit">Lưu</button></div>
      </form>
    </div>
  </div></div>
</div>
{% endblock %}
