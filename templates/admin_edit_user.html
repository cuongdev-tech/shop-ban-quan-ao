{% extends 'layout.html' %}
{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm p-4 rounded-4">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-dark">Chỉnh sửa Tài khoản</h3>
                    <p class="text-muted small">Cập nhật thông tin hoặc đổi mật khẩu cho: <span class="fw-bold text-primary">{{ user.email }}</span></p>
                </div>
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Vị trí / Vai trò</label>
                        <select name="role" class="form-select bg-light border-0 py-2">
                            <option value="Nhân viên" {% if user.role == 'Nhân viên' %}selected{% endif %}>Nhân viên bán hàng</option>
                            <option value="Admin" {% if user.role == 'Admin' %}selected{% endif %}>Quản trị viên</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Họ và tên</label>
                        <input type="text" name="name" class="form-control bg-light border-0 py-2" value="{{ user.name }}" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small">Mật khẩu mới (Bỏ trống nếu không muốn đổi)</label>
                        <input type="password" name="password" class="form-control bg-light border-0 py-2" placeholder="Nhập mật khẩu mới (nếu muốn đổi)">
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-dark flex-grow-1 rounded-pill fw-bold shadow-sm py-2 text-uppercase">Lưu thay đổi</button>
                        <a href="{{ url_for('admin_users') }}" class="btn btn-outline-secondary rounded-pill px-4 py-2">Quay lại</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
