{% extends 'layout.html' %}
{% block content %}
<div class="container-xl mt-4 mb-5">
  <div class="row justify-content-center"><div class="col-lg-7">
    <div class="bg-white rounded-4 shadow-sm p-4">
      <h4 class="fw-bold mb-3">{{ action }}</h4>
      <form method="POST">
        <div class="mb-2"><label class="form-label small fw-bold">Tên combo * (VD: Mua 2 tặng 1)</label><input name="name" class="form-control" required value="{{ c.get('name','') }}"></div>
        <div class="mb-2"><label class="form-label small fw-bold">Loại</label>
          <select name="combo_type" class="form-select"><option value="BUY_GET" {% if c.get('combo_type','BUY_GET')=='BUY_GET' %}selected{% endif %}>Mua X tặng Y</option><option value="BUNDLE" {% if c.get('combo_type')=='BUNDLE' %}selected{% endif %}>Set bộ giá gói</option></select>
        </div>
        <div class="row g-2">
          <div class="col-6"><label class="form-label small fw-bold">SP kích hoạt (id)</label><input name="trigger_product_id" type="number" min="1" class="form-control" value="{{ c.get('trigger_product_id','') }}"></div>
          <div class="col-6"><label class="form-label small fw-bold">SL kích hoạt</label><input name="trigger_qty" type="number" min="1" class="form-control" value="{{ c.get('trigger_qty',2) }}"></div>
        </div>
        <div class="row g-2 mt-2">
          <div class="col-6"><label class="form-label small fw-bold">SP tặng (id)</label><input name="gift_product_id" type="number" min="1" class="form-control" value="{{ c.get('gift_product_id','') }}"></div>
          <div class="col-6"><label class="form-label small fw-bold">SL tặng</label><input name="gift_qty" type="number" min="1" class="form-control" value="{{ c.get('gift_qty',1) }}"></div>
        </div>
        <div class="row g-2 mt-2">
          <div class="col-6"><label class="form-label small fw-bold">Set bộ (ids cách nhau dấu phẩy)</label><input name="bundle_product_ids" class="form-control" value="{{ c.get('bundle_product_ids','') }}" placeholder="VD: 1,2,3"></div>
          <div class="col-6"><label class="form-label small fw-bold">Giá gói (đ)</label><input name="bundle_price" type="number" min="0" step="1000" class="form-control" value="{{ c.get('bundle_price','') }}"></div>
        </div>
        <div class="row g-2 mt-2">
          <div class="col-6"><label class="form-label small fw-bold">Bắt đầu (trống = luôn)</label><input name="start_at" type="datetime-local" class="form-control" value="{{ c.get('start_at','') }}"></div>
          <div class="col-6"><label class="form-label small fw-bold">Kết thúc (trống = luôn)</label><input name="end_at" type="datetime-local" class="form-control" value="{{ c.get('end_at','') }}"></div>
        </div>
        <div class="form-check mt-2"><input type="checkbox" name="is_active" class="form-check-input" {% if c.get('is_active',1) %}checked{% endif %}><label class="form-check-label small fw-bold">Bật</label></div>
        <div class="mt-2 small text-muted">SP tham khảo:{% for pr in prods %} #{{ pr.id }} {{ pr.name }};{% endfor %}</div>
        <div class="d-flex gap-2 justify-content-end mt-3"><a href="{{ url_for('admin_combos') }}" class="btn btn-light rounded-pill px-4 fw-bold">Hủy</a><button class="btn btn-dark rounded-pill px-4 fw-bold" type="submit">Lưu</button></div>
      </form>
    </div>
  </div></div>
</div>
{% endblock %}
